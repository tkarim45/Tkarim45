<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 320" width="900" height="320" font-family="'Fira Code','SFMono-Regular',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#0d1c38"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="0.55" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="conduitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pkt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#93c5fd"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hData" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#e0f4ff"/><stop offset="0.4" stop-color="#38bdf8"/><stop offset="1" stop-color="#0b3a5c"/></radialGradient>
    <radialGradient id="hModel" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#dcebff"/><stop offset="0.4" stop-color="#3b82f6"/><stop offset="1" stop-color="#11295c"/></radialGradient>
    <radialGradient id="hEval" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#d6fbff"/><stop offset="0.4" stop-color="#22d3ee"/><stop offset="1" stop-color="#0a3d49"/></radialGradient>
    <radialGradient id="hShip" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#e4ffe6"/><stop offset="0.4" stop-color="#4ade80"/><stop offset="1" stop-color="#123b1e"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="318" rx="22"/></clipPath>
    <path id="conduit" d="M150,172 C240,112 300,116 360,150 C430,190 500,124 560,154 C630,188 700,112 750,144" fill="none"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="320" fill="url(#bg)"/>
    <ellipse cx="450" cy="150" rx="560" ry="230" fill="url(#core)"/>

    <!-- parallax starfield: far layer -->
    <g fill="#7f93c8" opacity="0.8">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="40s" repeatCount="indefinite"/>
        <circle cx="60" cy="40" r="0.9"/><circle cx="210" cy="26" r="0.8"/><circle cx="380" cy="52" r="0.9"/>
        <circle cx="520" cy="30" r="0.8"/><circle cx="690" cy="44" r="0.9"/><circle cx="840" cy="28" r="0.8"/>
        <circle cx="150" cy="70" r="0.7"/><circle cx="470" cy="76" r="0.7"/><circle cx="770" cy="72" r="0.7"/>
      </g>
    </g>
    <!-- near layer, twinkle -->
    <g fill="#cfe0ff">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;24 0;0 0" dur="26s" repeatCount="indefinite"/>
        <circle cx="110" cy="52" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
        <circle cx="300" cy="38" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="600" cy="34" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
        <circle cx="820" cy="58" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- ===== neural constellation (background) ===== -->
    <g stroke="#3b82f6" stroke-opacity="0.22" stroke-width="1" fill="none">
      <g stroke-dasharray="5 9">
        <animate attributeName="stroke-dashoffset" values="0;-28" dur="2.4s" repeatCount="indefinite"/>
        <line x1="70" y1="70" x2="150" y2="130"/>
        <line x1="150" y1="130" x2="250" y2="60"/>
        <line x1="250" y1="60" x2="470" y2="70"/>
        <line x1="470" y1="70" x2="520" y2="120"/>
        <line x1="520" y1="120" x2="600" y2="60"/>
        <line x1="600" y1="60" x2="770" y2="80"/>
        <line x1="770" y1="80" x2="845" y2="185"/>
        <line x1="845" y1="185" x2="655" y2="215"/>
        <line x1="655" y1="215" x2="430" y2="235"/>
        <line x1="430" y1="235" x2="330" y2="205"/>
        <line x1="330" y1="205" x2="200" y2="245"/>
        <line x1="200" y1="245" x2="150" y2="130"/>
        <line x1="470" y1="70" x2="430" y2="235"/>
        <line x1="520" y1="120" x2="655" y2="215"/>
      </g>
    </g>
    <!-- constellation nodes -->
    <g fill="#60a5fa">
      <circle cx="70"  cy="70"  r="2.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="130" r="2"><animate attributeName="opacity" values="1;0.4;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="60"  r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="70"  r="2.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="120" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="60"  r="2.2"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="80"  r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="845" cy="185" r="2.2"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="655" cy="215" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="235" r="2.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="205" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.0s" repeatCount="indefinite"/></circle>
      <circle cx="200" cy="245" r="2.4"><animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#4a6aa5" font-size="8.5" letter-spacing="1" opacity="0.8">
      <text x="60"  y="62">MLOPS</text>
      <text x="258" y="52">RAG</text>
      <text x="452" y="62">AGENTS</text>
      <text x="782" y="74">BEDROCK</text>
      <text x="852" y="182">FAISS</text>
      <text x="210" y="252">RRF</text>
    </g>

    <!-- ===== cinematic light sweep ===== -->
    <g transform="skewX(-16)"><rect x="-320" y="-40" width="150" height="440" fill="url(#sweep)"><animate attributeName="x" values="-360;1160" dur="7s" repeatCount="indefinite"/></rect></g>

    <!-- ===== headline (not the name) ===== -->
    <text x="450" y="98" text-anchor="middle" font-weight="700" font-size="29" letter-spacing="2.5" fill="url(#titleGrad)" filter="url(#glow)">SHIPPING &amp; MEASURING LLM SYSTEMS</text>
    <text x="450" y="122" text-anchor="middle" fill="#7fa8e8" font-size="11.5" letter-spacing="4.5" opacity="0.92">LLM EVALUATION &amp; SAFETY · RAG · AGENTS · MLOPS</text>

    <!-- ===== pipeline conduit ===== -->
    <use xlink:href="#conduit" stroke="url(#conduitGrad)" stroke-width="3" filter="url(#glow)" stroke-linecap="round"/>
    <use xlink:href="#conduit" stroke="#e7f2ff" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 13" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="1.2s" repeatCount="indefinite"/>
    </use>

    <!-- data packets (comets) -->
    <circle r="6" fill="url(#pkt)"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath xlink:href="#conduit"/></animateMotion></circle>
    <circle r="4.5" fill="url(#pkt)"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#conduit"/></animateMotion></circle>
    <circle r="3.5" fill="url(#pkt)"><animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite"><mpath xlink:href="#conduit"/></animateMotion></circle>

    <!-- ===== hubs: DATA MODEL EVAL SHIP ===== -->
    <g font-size="12" font-weight="600" letter-spacing="1.6" text-anchor="middle">
      <g transform="translate(150,172)">
        <circle r="12" fill="none" stroke="#38bdf8"><animate attributeName="r" values="12;30;12" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle r="14" fill="url(#hData)" filter="url(#glow)"/><ellipse cx="-4" cy="-5" rx="4.5" ry="3" fill="#fff" opacity="0.6"/>
        <text y="34" fill="#38bdf8">DATA</text>
      </g>
      <g transform="translate(360,150)">
        <circle r="12" fill="none" stroke="#3b82f6"><animate attributeName="r" values="12;30;12" dur="2.6s" begin="0.65s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="2.6s" begin="0.65s" repeatCount="indefinite"/></circle>
        <circle r="14" fill="url(#hModel)" filter="url(#glow)"/><ellipse cx="-4" cy="-5" rx="4.5" ry="3" fill="#fff" opacity="0.6"/>
        <text y="-22" fill="#60a5fa">MODEL</text>
      </g>
      <g transform="translate(560,154)">
        <circle r="12" fill="none" stroke="#22d3ee"><animate attributeName="r" values="12;30;12" dur="2.6s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
        <circle r="14" fill="url(#hEval)" filter="url(#glow)"/><ellipse cx="-4" cy="-5" rx="4.5" ry="3" fill="#fff" opacity="0.6"/>
        <text y="34" fill="#22d3ee">EVAL</text>
      </g>
      <g transform="translate(750,144)">
        <circle r="12" fill="none" stroke="#4ade80"><animate attributeName="r" values="12;30;12" dur="2.6s" begin="1.95s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="2.6s" begin="1.95s" repeatCount="indefinite"/></circle>
        <circle r="14" fill="url(#hShip)" filter="url(#glow)"/><ellipse cx="-4" cy="-5" rx="4.5" ry="3" fill="#fff" opacity="0.7"/>
        <text y="-22" fill="#4ade80">SHIP</text>
      </g>
    </g>

    <!-- ===== HUD frame ===== -->
    <g stroke="#38bdf8" stroke-width="1.6" fill="none" opacity="0.8">
      <path d="M22,22 h34 M22,22 v34"/>
      <path d="M878,22 h-34 M878,22 v34"/>
      <path d="M22,298 h34 M22,298 v-34"/>
      <path d="M878,298 h-34 M878,298 v-34"/>
    </g>
    <g font-size="10" letter-spacing="1.5">
      <circle cx="40" cy="44" r="3" fill="#4ade80"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="50" y="47" fill="#7f93bd">SYSTEM ONLINE</text>
      <text x="860" y="47" text-anchor="end" fill="#7f93bd">MODE: BUILD</text>
    </g>
    <!-- eval HUD meter -->
    <g transform="translate(720,286)" font-size="10" letter-spacing="1">
      <text x="0" y="0" fill="#7f93bd">EVAL</text>
      <rect x="34" y="-8" width="94" height="7" rx="3.5" fill="#16233f"/>
      <rect x="34" y="-8" width="10" height="7" rx="3.5" fill="#4ade80">
        <animate attributeName="width" values="10;88;10" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="134" y="0" fill="#4ade80">PASS</text>
    </g>
    <text x="40" y="290" fill="#7f93bd" font-size="10" letter-spacing="1">every result stated against a baseline</text>

    <!-- CRT scan + vignette + letterbox -->
    <rect x="0" y="0" width="900" height="2.5" fill="#93c5fd" opacity="0.10"><animate attributeName="y" values="-4;322" dur="5.5s" repeatCount="indefinite"/></rect>
    <rect width="900" height="320" fill="url(#vign)"/>
    <rect x="0" y="0" width="900" height="9" fill="#000" opacity="0.5"/>
    <rect x="0" y="311" width="900" height="9" fill="#000" opacity="0.5"/>
    <rect x="1" y="1" width="898" height="318" rx="22" fill="none" stroke="#24406b" stroke-width="1.5"/>
  </g>
</svg>
