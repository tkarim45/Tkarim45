name: Metrics

# Generates a single static github-metrics.svg committed into this repo, so the
# profile analytics never depend on a rate-limited third-party widget.
# Runs weekly and on-demand. First run must be triggered manually
# (Actions tab -> Metrics -> Run workflow) after METRICS_TOKEN is set.

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tkarim45
          filename: github-metrics.svg
          template: classic
          base: "header, repositories"
          config_timezone: Asia/Karachi
          config_display: large
          # Filter commits to Taimour's identities so the habits plugin does not
          # crash on third-party commits with a missing author object.
          commits_authoring: >-
            taimour.a.karim@gmail.com, taimour@bryge.io,
            taimour@datality.co.uk, tkarim45

          # Top languages (flat bar + legend)
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, tex, jupyter notebook

          # 3D isometric contribution calendar (half-year keeps the run light
          # enough that the languages plugin still gets its GraphQL quota)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
