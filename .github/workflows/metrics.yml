name: Metrics

# Generates a static github-metrics.svg committed into this repo, so the
# profile analytics never depend on a rate-limited third-party widget.
# Runs weekly and on-demand. First run must be triggered manually
# (Actions tab -> Metrics -> Run workflow) after METRICS_TOKEN is set.

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Stats + languages + habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tkarim45
          filename: github-metrics.svg
          template: classic
          base: "header, repositories"
          config_timezone: Asia/Karachi
          config_display: large

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, tex, jupyter notebook

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_time: yes

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tkarim45
          filename: github-metrics-calendar.svg
          base: ""
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
